<style>
/* --------------------------------------------------
   GLOBAL
-------------------------------------------------- */
* {
    box-sizing: border-box;
}

body {
    width: 100vw;
    margin: 0;
    background-color: #262626;
    font-family: 'Bricolage Grotesque', sans-serif;
    font-size: 22px;
    padding-top: 75px; /* make space for fixed navbar */
}

header {
    display: flex;
    justify-content: center;
    align-items: center;
}

.titleart {
    width: 65%;
    display: block;
    margin: auto;
}

/* --------------------------------------------------
   NAVBAR
-------------------------------------------------- */
ul.navbar {
    list-style: none;
    margin: 0;
    padding: 0 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    position: fixed;
    top: 0;
    width: 100%;
    height: 70px;
    background-color: #ff54da;
    z-index: 1000;
}

ul.navbar li {
    margin: 0 10px;
    display: flex;
    align-items: center;
}

ul.navbar a {
    color: #262626;
    text-decoration: none;
    font-size: 26px;
    padding: 10px 18px;
    border-radius: 10px;
    transition: 0.25s;
    font-weight: bold;
}

ul.navbar a:hover {
    color: white;
}

ul.navbar i {
    font-size: 40px;
    line-height: 1;
}

/* Home icon - bigger but responsive */
ul.navbar .homeicon {
    font-size: min(55px, 8vw);
    line-height: 1;
}

/* --------------------------------------------------
   LEVEL BUTTONS
-------------------------------------------------- */
ul.level {
    list-style: none;
    margin: auto;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 45px;
    width: 100%;
}

ul.level li {
    width: 210px;
    height: 115px;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
}

ul.level a {
    color: #262626;
    text-decoration: none;
    font-size: 28px;
    padding: 10px 18px;
    border-radius: 10px;
    transition: 0.25s;
}

ul.level a:hover {
    color: white;
}

/* --------------------------------------------------
   RESPONSIVE (Mobile & small screens)
-------------------------------------------------- */
@media (max-width: 800px) {

    /* Navbar */
    ul.navbar {
        flex-wrap: wrap;
        height: auto;
        padding: 10px 0;
    }

    ul.navbar a {
        font-size: 20px;
        padding: 6px 12px;
    }

    ul.navbar .homeicon {
        font-size: 40px;
    }

    /* Level buttons */
    ul.level {
        flex-wrap: wrap;
        gap: 20px;
        margin-top: 40px;
    }

    ul.level li {
        width: min(210px, 35vw);
        height: min(115px, 25vw);
    }

    ul.level a {
        font-size: 20px;
    }

    /* Title image */
    .titleart {
        width: 90%;
    }
}

   </style>
