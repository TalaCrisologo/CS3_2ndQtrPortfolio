<!DOCTYPE html>
<html>

<head>
    <title> Club Form! </title>
    <link rel="icon" href="favicon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
        
    <style>
        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border: 2px solid #5D688A;
            box-shadow: 0 0 6px rgba(74, 144, 226, 0.5);
        }

        .invalid {
            border: 3px solid #FD7979;
        }

        .valid {
            border: 3px solid #3A6F43;
        }
        body {
            font-family: "Karla", sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 30px;
            min-height: 100vh;

            display: flex;
            flex-direction: column;

            background-color: #FFF2EF;
            color: #5D688A;
            text-align: left;
        }

        fieldset {
            margin: 20px 0;
            padding: 20px;

            border: 3px solid #5D688A;
            border-radius: 12px;
        }

        input[type="submit"],
        input[type="reset"] {
            margin: 10px;
            padding: 12px 28px;

            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;

            background-color: #5D688A;
            color: #FFF2EF;
        }
        button {
            margin: 10px;
            padding: 12px 28px;

            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;

            background-color: #5D688A;
            color: #FFF2EF;
        }
    </style>
</head>
<body>

<h1> ★'s Club Form!</h1>
<h2> Please enter all necessary information. Click submit when finished!</h2>

<form method="post" onsubmit="return sForm()" onreset="return rForm()">
<fieldset>

    <label for="StudentID">Student ID:</label>
    <input type="number" id="StudentID" onblur="check(this)"><br><br>

    <label for="fname">Full Name: </label>
    <input type="text" id="fname" onblur="check(this)"><br><br>

    <label for="bday">Birthday:</label>
    <input type="date" id="bday" onblur="check(this)"><br><br>

    <label for="mail">Email Address:</label>
    <input type="email" id="mail" onblur="check(this)"><br><br>

</fieldset>
<fieldset>

    <label for="phone">Mobile Phone:</label>
    <input type="text" id="phone" onblur="check(this)"><br><br>

    <label for="year">Grade Level:</label>
    <select name="year" id="year">
        <option value="7">Grade 7</option>
        <option value="8">Grade 8</option>
        <option value="9">Grade 9</option>
        <option value="10">Grade 10</option>
        <option value="11">Grade 11</option>
        <option value="12">Grade 12</option>
      </select> <br>

    <label for="status">Intern / Extern:</label><br>
        <input type="radio" id="intern" name="status" value="INTERN">
        <label for="intern">Intern</label><br>
        <input type="radio" id="extern" name="status" value="EXTERN">
        <label for="extern">Extern</label><br>

    <label for="club">Preferred Organization/Club:</label>
        <select name="club" id="club">
            <option value="Alianti">Alianti</option>
            <option value="XYZ">Pisay XYZ</option>
            <option value="Expo">Exposure</option>
            <option value="Kislap">Kislap</option>
            <option value="Lab">Labuyo</option>
        </select> <br>

    <label for="message">Why do you want to join this organization?</label><br>
        <textarea id="message" name="message" onblur="check(this)">
        </textarea>
</fieldset>
    <input type="submit" value="Submit">
    <input type="reset" value="Reset">
    <button type="button" onclick="viewSignups()">View Signups</button>
</form>

<script>
function sForm() {

    let invalids = document.querySelectorAll(".invalid");
    if (invalids.length > 0) {
        alert("Please fill out all required fields.");
        return false;
    }
  
    if (!confirm("Do you want to submit this form?")) return false;

    let signups = JSON.parse(localStorage.getItem("cSignup")) || [];
    let status = document.querySelector('input[name="status"]:checked');

    let signup = {
        studentID: document.getElementById("StudentID").value,
        name: document.getElementById("fname").value,
        birthday: document.getElementById("bday").value,
        email: document.getElementById("mail").value,
        phone: document.getElementById("phone").value,
        grade: document.getElementById("year").value,
        status: status ? status.value : "",
        club: document.getElementById("club").value,
        message: document.getElementById("message").value,
    };

    signups.push(signup);
    localStorage.setItem("cSignup", JSON.stringify(signups));

    alert("Signup saved!");
    return false;
}

function viewSignups() {
    window.location.href = "viewSignUps.html";
}

function rForm() {
    return confirm("Do you want to reset the form? All your data will be cleared.");
}

function check(element) {
    if (element.value.trim() === "") {
        element.classList.add("invalid");
        element.classList.remove("valid");
    } else {
        element.classList.add("valid");
        element.classList.remove("invalid");
    }
}
</script>


</body>
</html>
